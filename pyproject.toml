[project]
name = "it-market-intelligence"
version = "3.0.0"
description = "Thailand IT hardware market intelligence dashboard"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.141.1,<1.0.0",
  "httpx>=0.28.1,<1.0.0",
  "python-dotenv>=1.1.0,<2.0.0",
  "uvicorn>=0.35.0,<1.0.0",
  "pyodbc>=5.2.0,<6.0.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
